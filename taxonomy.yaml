# /watch Topic Taxonomy — controlled vocabulary for multi-level video tagging
#
# PURPOSE
# -------
# When the AI extracts topics from a video, it must use slugs from this file.
# Using controlled slugs (not free-form strings) means two videos tagged
# "real-estate/multi-family/management/evictions" are automatically linked —
# regardless of whether the speaker said "eviction process", "removing tenants",
# or "unlawful detainer."
#
# HOW TAGGING WORKS
# -----------------
# A video about hard money loans for a multi-family acquisition gets tagged at
# EVERY applicable level simultaneously:
#   real-estate
#   real-estate/multi-family
#   real-estate/multi-family/acquisition
#   real-estate/multi-family/acquisition/hard-money
#
# Each level is stored as a separate video_entities row (entity_type="topic").
# Each level gets its own hub page. Hub pages at higher levels aggregate all
# videos in that subtree — so "real-estate" hub lists ALL real estate videos.
#
# ADDING NEW NODES
# ----------------
# If the AI encounters a concept not in this file, it must:
#   1. Tag the video at the nearest parent that IS in the taxonomy
#   2. Propose the new node in parentheses: "(new: real-estate/multi-family/syndication)"
# Marcus reviews proposals and adds approved entries here.
# New entries take effect on the next video processed — no backfill needed
# (hub pages regenerate from DB state on each new persist).
#
# SLUG RULES
# ----------
# - Lowercase, hyphens only (no underscores, no slashes in the key)
# - Parent path is implied by nesting — do not repeat parent in child key
# - label: is the human-readable display name shown in hub pages
# - The full slug used in video_entities is the dotted/slashed path, e.g.
#   real-estate.multi-family.acquisition.hard-money

